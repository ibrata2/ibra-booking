name: ibra_booking
description: "IBRA BOOKING — حجوزات IBRA: مدير الحجوزات والمواعيد الشخصية للمناسبات."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.0
  url_launcher: ^6.3.0
  file_picker: ^13.0.0
  share_plus: ^13.0.0
  record: ^7.0.0
  local_auth: ^3.0.0
  flutter_contacts: ^2.0.0
  ibra_native:
    path: packages/ibra_native

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
