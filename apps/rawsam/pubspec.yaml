name: rawsam
description: "روسم للتجميل — تطبيق الزبائن: أعمالنا، المنشورات والعروض، المحادثة والحجز، الهدايا، والوصول للمركز."
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.18.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.0
  webview_flutter: ^4.14.0
  qr_flutter: ^4.1.0
  native_geofence: ^1.5.1
  geolocator: ^14.1.0
  permission_handler: ^13.0.0
  url_launcher: ^6.3.0
  just_audio: ^0.10.6
  shared_preferences: ^2.5.0
  image_picker: ^1.2.0
  package_info_plus: ^10.2.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi.ttf
