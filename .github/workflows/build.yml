name: Build IBRA BOOKING

# يبني نسخ أندرويد (APK + AAB) و iOS (IPA غير موقع + مشروع Xcode)
# وينشرها تلقائياً في صفحة Releases عند كل رفع إلى main.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: IBRA-BOOKING

jobs:
  android:
    name: Android ${{ matrix.edition }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [events, general, center]
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: قراءة رقم الإصدار
        id: ver
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter --version

      - name: إنشاء مجلدات المنصات
        run: flutter create --org com.ibraprogram --project-name ibra_booking --platforms android,ios .

      - name: تجهيز المنصات والأيقونات
        run: |
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 tool/setup_platforms.py --edition ${{ matrix.edition }}

      - run: flutter pub get

      - name: الفحص
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: الاختبارات
        run: flutter test

      - name: توقيع الإصدار (اختياري)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: بناء APK
        run: |
          # إعادة المحاولة عند ضغط خوادم Maven (429)
          retry() { for n in 1 2 3 4; do "$@" && return 0; echo "إعادة المحاولة $n…"; sleep $((n * 45)); done; return 1; }
          retry flutter build apk --release --dart-define=EDITION=${{ matrix.edition }}
          retry flutter build apk --release --split-per-abi --dart-define=EDITION=${{ matrix.edition }}

      - name: بناء AAB
        run: |
          retry() { for n in 1 2 3 4; do "$@" && return 0; echo "إعادة المحاولة $n…"; sleep $((n * 45)); done; return 1; }
          retry flutter build appbundle --release --dart-define=EDITION=${{ matrix.edition }}

      - name: تجميع الملفات
        run: |
          V=${{ steps.ver.outputs.version }}
          if [ "${{ matrix.edition }}" = "general" ]; then APP=IBRA-Bookings-General; fi
          if [ "${{ matrix.edition }}" = "center" ]; then APP=IBRA-Center; fi
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/$APP-$V-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/$APP-$V-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/$APP-$V-android-arm32.apk
          cp build/app/outputs/bundle/release/app-release.aab out/$APP-$V-android.aab
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.edition }}
          path: out/*

  ios:
    name: iOS ${{ matrix.edition }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: events
            runner: macos-latest
          # جهاز Mac مختلف لتفادي زحمة أجهزة arm64 عند GitHub
          - edition: general
            runner: macos-15-intel
          - edition: center
            runner: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: إنشاء مجلدات المنصات
        run: flutter create --org com.ibraprogram --project-name ibra_booking --platforms android,ios .

      - name: تجهيز المنصات والأيقونات
        run: |
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 tool/setup_platforms.py --edition ${{ matrix.edition }}

      - run: flutter pub get

      - name: بناء iOS بدون توقيع
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; echo "إعادة المحاولة $n…"; sleep $((n * 45)); done; return 1; }
          retry flutter build ios --release --no-codesign --dart-define=EDITION=${{ matrix.edition }}

      - name: تجميع IPA ومشروع Xcode
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "${{ matrix.edition }}" = "general" ]; then APP=IBRA-Bookings-General; fi
          if [ "${{ matrix.edition }}" = "center" ]; then APP=IBRA-Center; fi
          mkdir -p out Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry out/$APP-$V-ios-unsigned.ipa Payload
          # مشروع Flutter كامل مع مجلد ios جاهز للفتح في Xcode (Runner.xcworkspace)
          zip -qry out/$APP-$V-ios-xcode-project.zip . -x "build/*" ".dart_tool/*" "out/*" "Payload/*" ".git/*" "android/.gradle/*" "ios/Pods/*" "ios/.symlinks/*"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.edition }}
          path: out/*

  release:
    name: نشر الإصدار
    needs: [android, ios]
    # ننشر ما نجح حتى لو تأخر جهاز macOS عند GitHub
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.android.outputs.version }}
          name: IBRA BOOKING v${{ needs.android.outputs.version }} — حجوزات IBRA + الحجوزات IBRA
          body: |
            ## ثلاث نسخ من التطبيق

            ### 🌙 حجوزات IBRA — `IBRA-BOOKING-*`
            للعاملين في الفواتح ومجالس العزاء والمواليد والأفراح والمجالس الدينية.

            ### 💇 مواعيد المركز IBRA — `IBRA-Center-*`
            لمراكز التجميل والعيادات والصالونات (مثل Setmore): موظفون بساعات دوام، خدمات بمدد وأسعار، أوقات فارغة تلقائية، تقويم بعمود لكل موظف، وتذكير قبل 15 دقيقة.

            ### 💼 الحجوزات IBRA — `IBRA-Bookings-General-*`
            نسخة عامة لأي شخص لديه عمل ومواعيد (عملاء، اجتماعات، زيارات، جلسات). تُثبَّت بجانب النسخ الأخرى.

            **لكل نسخة:**
            - **أندرويد:** `android-universal.apk` لكل الأجهزة، أو `arm64` للأجهزة الحديثة بحجم أصغر.
            - **Google Play:** `android.aab`.
            - **آيفون:** `ios-unsigned.ipa` (يحتاج توقيع عبر Sideloadly / AltStore أو حساب مطور)، و `ios-xcode-project.zip`.

            برمجة وتطوير ابراهيم الخزرجي — https://ibraprogram.netlify.app/
          files: dist/*
          make_latest: true
