name: probe-packages
on:
  push:
    branches: [rawsam-client]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: resolve
        run: |
          flutter create --org com.ibraprogram --platforms android,ios probeapp
          cd probeapp
          flutter pub add flutter_riverpod supabase_flutter firebase_core firebase_messaging flutter_local_notifications webview_flutter qr_flutter native_geofence geolocator permission_handler url_launcher just_audio shared_preferences image_picker package_info_plus mobile_scanner record path_provider timezone
          grep -A2 -E "^  (flutter_riverpod|supabase_flutter|supabase|realtime_client|gotrue|postgrest|storage_client|firebase_core|firebase_messaging|flutter_local_notifications|webview_flutter|qr_flutter|native_geofence|geolocator|permission_handler|url_launcher|just_audio|shared_preferences|image_picker|package_info_plus|mobile_scanner|record|path_provider|timezone):" pubspec.lock
      - name: dump-apis
        run: |
          cd probeapp
          P=$HOME/.pub-cache/hosted/pub.dev
          ls $P | grep -E "native_geofence|mobile_scanner|qr_flutter|supabase_flutter|gotrue|realtime|webview_flutter-|firebase_messaging-|geolocator-|permission_handler-"
          G=$(ls -d $P/native_geofence-* | tail -1); echo "=== $G"; cat $G/README.md | head -150; find $G/lib -name "*.dart" | head -40; cat $G/lib/native_geofence.dart; for f in $(find $G/lib/src -name "*.dart" | grep -v -E "generated|pigeon"); do echo "--- $f"; grep -n -E "^(class|enum|typedef|  (static )?(Future|void|final|const|[A-Z][A-Za-z<>?]* [a-z][A-Za-z]*\(|required))" $f | head -60; done
          M=$(ls -d $P/mobile_scanner-* | tail -1); echo "=== $M"; grep -n -E "^\s+(Future|Stream|final|const|MobileScanner\(|required|this\.)" $M/lib/src/mobile_scanner.dart | head -60; grep -n -E "^\s+(Future|Stream|MobileScannerController\(|this\.)" $M/lib/src/mobile_scanner_controller.dart | head -60; grep -n -E "class BarcodeCapture|final" $M/lib/src/objects/barcode_capture.dart | head
          Q=$(ls -d $P/qr_flutter-* | tail -1); echo "=== $Q"; grep -n -E "QrImageView\(|this\." $Q/lib/src/qr_image_view.dart | head -30
          GL=$(ls -d $P/geolocator-* | tail -1); grep -n "static Future" $GL/lib/geolocator.dart | head -30
          GT=$(ls -d $P/gotrue-* | tail -1); grep -n -E "Future<AuthResponse> (signInAnonymously|signInWithPassword)|Future<.*> (signOut|updateUser)" $GT/lib/src/gotrue_client.dart
          FM=$(ls -d $P/firebase_messaging-* | tail -1); grep -n -E "static|Future<.*> (getToken|requestPermission|subscribeToTopic)" $FM/lib/src/messaging.dart | head -30
          JA=$(ls -d $P/just_audio-* | tail -1); grep -n -E "Future<Duration\?> (setUrl|setAsset|setFilePath)" $JA/lib/just_audio.dart
          RC=$(ls -d $P/record-* | tail -1); grep -n -E "Future<.*> (start|stop)\(" $RC/lib/src/record.dart
          IP=$(ls -d $P/image_picker-* | tail -1); grep -n "Future<XFile?> pickImage" -A8 $IP/lib/image_picker.dart | head -12
      - name: analyze-sample
        run: echo done
